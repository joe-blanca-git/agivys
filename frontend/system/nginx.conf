server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback pro index.html: sem isso, dar F5 numa rota do Angular
    # (ex.: /agivys/portal/auth/login) devolve 404 do nginx em vez de
    # deixar o Angular Router decidir a rota no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
