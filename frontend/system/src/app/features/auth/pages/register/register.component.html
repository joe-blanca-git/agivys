<div class="register-page">
  <div class="register-glow register-glow-1"></div>
  <div class="register-glow register-glow-2"></div>

  <div class="register-content">
    <div class="register-badge-logo">
      <img class="logo" src="images/logo/logo-brand-light.png" alt="AGIVYS">
    </div>

    <div class="register-card">
      <div class="badge-neon mx-auto">CRIAR CONTA</div>
      <h1 class="register-title">Comece sua jornada com a AGIVYS</h1>
      <p class="register-subtitle">Preencha seus dados para criar sua conta gratuitamente.</p>

      <app-register-form></app-register-form>

      <div class="register-back-link">
        Já tem uma conta? <a [routerLink]="['/auth/login']" class="link-neon">Fazer login</a>
      </div>
    </div>

    <div class="register-footer">
      <span class="register-copyright">Copyright &copy; 2026 Agivys MEI. Todos os direitos são reservados.</span>
    </div>
  </div>
</div>
