<form class="register-form" [formGroup]="formRegister" (ngSubmit)="onSubmit()" novalidate>

  <!-- NOME -->
  <div class="mb-4 text-start">
    <label for="name" class="form-label">Nome Completo</label>
    <input
      [disabled]="isLoading"
      type="text"
      id="name"
      formControlName="name"
      class="form-control"
      placeholder="Seu nome completo"
      [ngClass]="{
        'is-invalid': (f['name'].touched || submitted) && f['name'].invalid,
        'is-valid': (f['name'].touched || submitted) && f['name'].valid
      }"
      required
    />
    <div class="invalid-feedback d-block" *ngIf="(f['name'].touched || submitted) && f['name'].invalid">
      Informe seu nome completo.
    </div>
  </div>

  <!-- EMAIL -->
  <div class="mb-4 text-start">
    <label for="email" class="form-label">E-mail</label>
    <input
      [disabled]="isLoading"
      type="email"
      id="email"
      formControlName="email"
      class="form-control"
      placeholder="seu@email.com"
      [ngClass]="{
        'is-invalid': (f['email'].touched || submitted) && f['email'].invalid,
        'is-valid': (f['email'].touched || submitted) && f['email'].valid
      }"
      required
    />
    <div class="invalid-feedback d-block" *ngIf="(f['email'].touched || submitted) && f['email'].invalid">
      Informe um e-mail válido.
    </div>
  </div>

  <!-- TELEFONE + NASCIMENTO -->
  <div class="row-fields mb-4">
    <div class="text-start">
      <label for="phone" class="form-label">Telefone</label>
      <input
        [disabled]="isLoading"
        type="text"
        id="phone"
        formControlName="phone"
        class="form-control"
        mask="(00) [0]0000-0000"
        [dropSpecialCharacters]="false"
        placeholder="(00) 00000-0000"
        [ngClass]="{
          'is-invalid': (f['phone'].touched || submitted) && f['phone'].invalid,
          'is-valid': (f['phone'].touched || submitted) && f['phone'].valid
        }"
        required
      />
      <div class="invalid-feedback d-block" *ngIf="(f['phone'].touched || submitted) && f['phone'].invalid">
        Informe seu telefone.
      </div>
    </div>

    <div class="text-start">
      <label for="birthDate" class="form-label">Nascimento</label>
      <input
        [disabled]="isLoading"
        type="date"
        id="birthDate"
        formControlName="birthDate"
        class="form-control"
        [ngClass]="{
          'is-invalid': (f['birthDate'].touched || submitted) && f['birthDate'].invalid,
          'is-valid': (f['birthDate'].touched || submitted) && f['birthDate'].valid
        }"
        required
      />
      <div class="invalid-feedback d-block" *ngIf="(f['birthDate'].touched || submitted) && f['birthDate'].invalid">
        Informe sua data de nascimento.
      </div>
    </div>
  </div>

  <!-- SENHA -->
  <div class="mb-4 text-start">
    <label for="password" class="form-label">Senha</label>
    <div class="input-group">
      <input
        [disabled]="isLoading"
        [type]="hidePassword ? 'password' : 'text'"
        id="password"
        formControlName="password"
        class="form-control"
        placeholder="Crie uma senha"
        [ngClass]="{
          'is-invalid': (f['password'].touched || submitted) && f['password'].invalid,
          'is-valid': (f['password'].touched || submitted) && f['password'].valid
        }"
        required
      />
      <button
        class="btn btn-eye"
        type="button"
        (click)="hidePassword = !hidePassword"
        [disabled]="isLoading"
      >
        <i class="fa-solid" [ngClass]="hidePassword ? 'fa-eye-slash' : 'fa-eye'"></i>
      </button>
    </div>

    <div class="password-checklist mt-2">
      <span class="check-item" [class.valid]="hasMinLength()">
        <i class="fa-solid" [ngClass]="hasMinLength() ? 'fa-circle-check' : 'fa-circle'"></i> 8+ caracteres
      </span>
      <span class="check-item" [class.valid]="hasUpperCase()">
        <i class="fa-solid" [ngClass]="hasUpperCase() ? 'fa-circle-check' : 'fa-circle'"></i> 1 maiúscula
      </span>
      <span class="check-item" [class.valid]="hasNumber()">
        <i class="fa-solid" [ngClass]="hasNumber() ? 'fa-circle-check' : 'fa-circle'"></i> 1 número
      </span>
      <span class="check-item" [class.valid]="hasSpecialChar()">
        <i class="fa-solid" [ngClass]="hasSpecialChar() ? 'fa-circle-check' : 'fa-circle'"></i> 1 caractere especial
      </span>
    </div>
  </div>

  <!-- CONFIRMAR SENHA -->
  <div class="mb-4 text-start">
    <label for="passwordConfirmation" class="form-label">Confirmar Senha</label>
    <div class="input-group">
      <input
        [disabled]="isLoading"
        [type]="hidePasswordConfirmation ? 'password' : 'text'"
        id="passwordConfirmation"
        formControlName="passwordConfirmation"
        class="form-control"
        placeholder="Repita a senha"
        [ngClass]="{
          'is-invalid': (f['passwordConfirmation'].touched || submitted) && f['passwordConfirmation'].invalid,
          'is-valid': (f['passwordConfirmation'].touched || submitted) && f['passwordConfirmation'].valid
        }"
        required
      />
      <button
        class="btn btn-eye"
        type="button"
        (click)="hidePasswordConfirmation = !hidePasswordConfirmation"
        [disabled]="isLoading"
      >
        <i class="fa-solid" [ngClass]="hidePasswordConfirmation ? 'fa-eye-slash' : 'fa-eye'"></i>
      </button>
    </div>
    <div class="invalid-feedback d-block" *ngIf="(f['passwordConfirmation'].touched || submitted) && f['passwordConfirmation'].errors?.['required']">
      Confirme sua senha.
    </div>
    <div class="invalid-feedback d-block" *ngIf="(f['passwordConfirmation'].touched || submitted) && f['passwordConfirmation'].errors?.['passwordMismatch']">
      As senhas não conferem.
    </div>
  </div>

  <!-- BOTÃO -->
  <button [disabled]="isLoading" type="submit" class="btn btn-neon-submit w-100">
    <span *ngIf="isLoading"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>Criando conta...</span>
    <span *ngIf="!isLoading">Criar Conta &rarr;</span>
  </button>

</form>
