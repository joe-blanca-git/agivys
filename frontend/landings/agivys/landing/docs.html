<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>AGIVYS API Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="plugins/themify-icons/themify-icons.css">

  <!-- Documentation Theme -->
  <link href="css/custom-docs.css" rel="stylesheet">
  
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body class="docs-body">

  <!-- TOPBAR -->
  <header class="docs-topbar">
    <div class="docs-logo-container">
      <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="ti-menu"></i></button>
      <a href="index.html">
        <img src="images/logo.png" alt="AGIVYS API">
      </a>
      <span style="font-weight: 600; font-size: 0.9rem;">API Documentation</span>
      <span class="docs-badge-version">v1</span>
    </div>
    
    <div class="docs-search-container">
      <i class="ti-search docs-search-icon"></i>
      <input type="text" id="searchInput" class="docs-search-input" placeholder="Buscar endpoint, recurso ou schema..." autocomplete="off">
      <div class="docs-search-results" id="searchResults">
        <!-- Results will be injected here -->
      </div>
    </div>
    
    <div class="docs-topbar-actions">
      <a href="index.html" class="docs-nav-link d-none d-md-block" style="display: flex; align-items: center; gap: 6px;"><i class="ti-arrow-left"></i> Voltar para Port Agivys</a>
      <a href="#" class="docs-nav-link d-none d-md-block">API Status</a>
      <a href="http://localhost:4200" class="docs-nav-link">Entrar</a>
      <a href="http://localhost:4200/auth/register" style="background: var(--docs-primary); color: #000; padding: 6px 16px; border-radius: 4px; text-decoration: none; font-size: 0.85rem; font-weight: 600;">Criar Conta</a>
    </div>
  </header>

  <!-- SIDEBAR -->
  <nav class="docs-sidebar" id="docsSidebar">
    <div class="sidebar-group">
      <div class="sidebar-title">Introdução</div>
      <a href="#overview" class="sidebar-link active">Visão Geral</a>
      <a href="#getting-started" class="sidebar-link">Começando</a>
      <a href="#authentication" class="sidebar-link">Autenticação</a>
      <a href="#errors" class="sidebar-link">Tratamento de erros</a>
    </div>
    
    <div id="dynamicSidebarGroups">
      <!-- Generated by JS -->
    </div>
    
    <div class="sidebar-group" id="schemasSidebarGroup">
      <div class="sidebar-title">Schemas</div>
      <!-- Generated by JS -->
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="docs-main" id="mainContent">
    <!-- View de carregamento / Erro -->
    <div id="loadingView" style="text-align: center; padding: 100px;">
        <i class="ti-reload" style="animation: spin 1s linear infinite; font-size: 2rem; color: var(--docs-primary);"></i>
        <p style="margin-top: 20px; color: var(--docs-text-muted);">Carregando especificação da API...</p>
    </div>

    <!-- Container Dinâmico -->
    <div id="contentContainer" style="display: none;">
        <!-- Injetado pelo JS (Home, Endpoint, Schema, etc) -->
    </div>
  </main>

  <!-- TRY IT OUT DRAWER -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="tryit-drawer" id="tryitDrawer">
    <div class="tryit-header">
      <h3 id="tryitTitle">Teste de Endpoint</h3>
      <button class="tryit-close" id="tryitClose">&times;</button>
    </div>
    <div class="tryit-body">
      <div class="tryit-group">
        <label class="tryit-label">Base URL</label>
        <input type="text" class="tryit-input" value="https://joederblanca.com.br/agivys-api" readonly>
      </div>
      
      <div id="tryitAuthGroup" class="tryit-group" style="display: none;">
        <label class="tryit-label"><i class="ti-lock" style="color: var(--docs-primary);"></i> Bearer Token (Global)</label>
        <input type="text" class="tryit-input" id="tryitTokenInput" placeholder="eyJhbGciOi..." readonly style="opacity: 0.5;">
        <small style="color: var(--docs-text-muted); font-size: 0.7rem; margin-top: 5px; display: block;">Configure o token na aba de Autenticação global.</small>
      </div>

      <div id="tryitParamsContainer"></div>
      
      <div id="tryitBodyContainer" class="tryit-group" style="display: none;">
        <label class="tryit-label">Request Body (JSON)</label>
        <textarea class="tryit-textarea" id="tryitBodyTextarea"></textarea>
      </div>
      
      <button class="tryit-execute-btn" id="tryitExecuteBtn">Executar Requisição</button>
      
      <div class="tryit-response" id="tryitResponseContainer">
        <label class="tryit-label">Response</label>
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
            <span id="tryitStatus" class="status-badge"></span>
            <span id="tryitTime" style="font-size: 0.8rem; color: var(--docs-text-muted);"></span>
        </div>
        <div class="code-block-wrapper">
          <div class="code-header">
            <span class="code-lang">JSON</span>
            <button class="code-copy" id="tryitCopyBtn">Copy</button>
          </div>
          <pre class="code-content" id="tryitResponseBody"></pre>
        </div>
      </div>
    </div>
  </aside>

  <!-- Script Engine -->
  <script src="js/docs-engine.js"></script>
</body>
</html>
